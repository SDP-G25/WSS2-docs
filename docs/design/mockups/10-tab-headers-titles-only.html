<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manara mockup: tab headers titles only</title>
<style>
:root{--text-primary:#1f1f1f;--text-secondary:#5f5f5f;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--text-primary:#ececec;--text-secondary:#a8a8a8}body{background:#161616}}
body{margin:0;padding:24px 16px;background:#fafafa;color:var(--text-primary);font-family:var(--font-sans)}
main{max-width:760px;margin:0 auto}
</style>
</head>
<body>
<main>
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Tops of the Debugging, History and Settings tabs with the logo tile removed, leaving a Fraunces title, a subtitle and the avatar.</h2>
<style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&display=swap');
.mg svg text{font-family:var(--font-sans)}.mg .sf{font-family:Fraunces,Georgia,serif}
.mg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:.5rem 0}
.cap{font-size:13px;color:var(--text-secondary);margin:6px 2px 0}.cap span{color:var(--text-primary);font-weight:500}</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs><clipPath id="top"><path d="M6 29 A23 23 0 0 1 29 6 H189 A23 23 0 0 1 212 29 V170 H6 Z"/></clipPath></defs>
<symbol id="boat" viewBox="0 0 40 40"><g fill="currentColor"><path d="M5 30 H35 L30.5 36 H9.5 Z"/><path d="M21.5 8 V27 H33 Z"/><path d="M18.5 12 V27 H8.5 Z" opacity=".85"/></g><path d="M20 30 V6" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="boatL" viewBox="0 0 40 40"><use href="#boat" width="40" height="40"/><circle cx="20" cy="4.5" r="3" fill="#EF9F27"/></symbol>
<symbol id="sbN" viewBox="0 0 206 30"><text x="18" y="19" font-size="11" fill="#FAEEDA">9:41</text><g fill="#FAEEDA"><rect x="152" y="14" width="2.5" height="5"/><rect x="156" y="12" width="2.5" height="7"/><rect x="160" y="10" width="2.5" height="9"/><rect x="174" y="12" width="13" height="5"/></g><rect x="172" y="10" width="18" height="9" rx="2.5" fill="none" stroke="#FAEEDA" stroke-width="1"/></symbol>
<symbol id="av" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#1B2F4A" stroke="#378ADD" stroke-width=".8"/><text x="15" y="19" font-size="12" font-weight="500" fill="#85B7EB" text-anchor="middle">A</text></symbol>
</svg>
<div class="mg">

<div><svg viewBox="0 0 218 170" width="100%" role="img" aria-label="Debugging tab header with title only"><path d="M1 29 A28 28 0 0 1 29 1 H189 A28 28 0 0 1 217 29 V170 H1 Z" fill="#050D18"/><g clip-path="url(#top)"><rect x="6" y="6" width="206" height="170" fill="#0B1A2E"/>
<text x="18" y="66" class="sf" font-size="22" fill="#FAEEDA">Debugging</text><use href="#av" x="175" y="38" width="30" height="30"/><text x="18" y="86" font-size="11" fill="#85B7EB">Assessment stages</text>
<rect x="18" y="100" width="182" height="44" rx="10" fill="#1B2F4A"/><text x="30" y="118" font-size="11" fill="#85B7EB">Stage 1</text><text x="30" y="134" font-size="12" font-weight="500" fill="#FAEEDA">Network profile</text><circle cx="186" cy="122" r="4" fill="#FAC775"/>
<rect x="18" y="152" width="182" height="44" rx="10" fill="#1B2F4A"/>
</g><use href="#sbN" x="6" y="6" width="206" height="30"/></svg><p class="cap"><span>Debugging</span> · title and avatar</p></div>

<div><svg viewBox="0 0 218 170" width="100%" role="img" aria-label="History tab header with title only"><path d="M1 29 A28 28 0 0 1 29 1 H189 A28 28 0 0 1 217 29 V170 H1 Z" fill="#050D18"/><g clip-path="url(#top)"><rect x="6" y="6" width="206" height="170" fill="#0B1A2E"/>
<text x="18" y="66" class="sf" font-size="22" fill="#FAEEDA">History</text><use href="#av" x="175" y="38" width="30" height="30"/><text x="18" y="86" font-size="11" fill="#85B7EB">Past assessments</text>
<rect x="18" y="100" width="182" height="48" rx="10" fill="#1B2F4A"/><use href="#boatL" x="26" y="110" width="28" height="28" style="color:#FAEEDA"/><text x="60" y="121" font-size="12" font-weight="500" fill="#FAEEDA">Home-5G</text><text x="60" y="136" font-size="11" fill="#85B7EB">Today, 9:12</text><rect x="142" y="115" width="50" height="18" rx="9" fill="#E6F1FB"/><text x="167" y="128" font-size="11" fill="#0C447C" text-anchor="middle">Trusted</text>
<rect x="18" y="156" width="182" height="48" rx="10" fill="#1B2F4A"/>
</g><use href="#sbN" x="6" y="6" width="206" height="30"/></svg><p class="cap"><span>History</span> · title and avatar</p></div>

<div><svg viewBox="0 0 218 170" width="100%" role="img" aria-label="Settings tab header with title only"><path d="M1 29 A28 28 0 0 1 29 1 H189 A28 28 0 0 1 217 29 V170 H1 Z" fill="#050D18"/><g clip-path="url(#top)"><rect x="6" y="6" width="206" height="170" fill="#0B1A2E"/>
<text x="18" y="66" class="sf" font-size="22" fill="#FAEEDA">Settings</text><use href="#av" x="175" y="38" width="30" height="30"/>
<rect x="18" y="82" width="182" height="58" rx="12" fill="#1B2F4A"/><text x="30" y="106" font-size="12" font-weight="500" fill="#FAEEDA">Sign in to Manara</text><text x="30" y="124" font-size="11" fill="#85B7EB">Back up your saved networks</text><path d="M186 106 l4 4 -4 4" fill="none" stroke="#85B7EB" stroke-width="1.4"/>
<text x="22" y="164" font-size="12" fill="#FAEEDA">Theme</text>
</g><use href="#sbN" x="6" y="6" width="206" height="30"/></svg><p class="cap"><span>Settings</span> · title and avatar</p></div>

</div>
</main>
</body>
</html>
