# Manara test AP — baseline (WPA2-Personal, 2.4 GHz).
# A correctly configured network: Manara should score this 100 / Secure.
# Change ONE thing per run to exercise a rule — see README.md for the table.
# Replace wlan1 with your USB card's name (check: iw dev).

interface=wlan1
driver=nl80211
country_code=QA

ssid=ManaraLab
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# WPA2-Personal (CCMP). This is the "good" control.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=ChangeThisPass123

# --- 5 GHz / 802.11ac: comment out hw_mode=g and channel=6 above, uncomment below ---
# hw_mode=a
# channel=36
# ieee80211ac=1
# ht_capab=[HT40+]
# vht_oper_chwidth=1
# vht_oper_centr_freq_seg0_idx=42
