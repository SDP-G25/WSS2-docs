# DHCP + DNS for the Manara test AP. Only needed for the connected-network
# tests (Stage 2/3); the pre-connection rules score from the scan list alone.
# Replace wlan1 with your USB card's name.

interface=wlan1
bind-interfaces

dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1

no-resolv
server=1.1.1.1
log-dhcp
log-queries

# --- Stage 3 DNS check: uncomment to make this network's DNS disagree with
#     the encrypted (DoH) lookup Manara compares against. Remove when done. ---
# address=/example.com/192.0.2.10
